<ion-header>
  <ion-toolbar color="primary">
    <ion-title mode="md" class="ion-text-center">Inicio de Sesion</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light" class="ion-padding">
  <div class="login-container">
    <ion-list>
      <ion-item>
        <ion-input label="Correo" labelPlacement="stacked" placeholder=""></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Contraseña" labelPlacement="stacked" placeholder="" type="password"></ion-input>
      </ion-item>
    </ion-list>

    <ion-button routerLink="/tabs/home" expand="block">
      Iniciar sesion
    </ion-button>
    <ion-button routerLink="/tabs/home" expand="block" color="secondary">
      Crear cuenta
    </ion-button>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar color="primary"></ion-toolbar>
</ion-footer>
