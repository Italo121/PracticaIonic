<ion-header>
  <ion-toolbar color="primary">
    <ion-title mode="md" class="ion-text-center">Mas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light" class="ion-padding">
  <ion-card>
    <ion-list>
      <ion-list-header>
        <h1>Herramientas</h1>
      </ion-list-header>
      
      <ion-item routerLink="/cursos">
        <ion-label>Cursos</ion-label>
        <ion-icon name="book-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item routerLink="/asistencias">
        <ion-label>Asistencias</ion-label>
        <ion-icon name="checkbox-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item >
        <ion-label routerLink="/calificaciones" >Calificaciones</ion-label>
        <ion-icon name="stats-chart-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item routerLink="/alumnos">
        <ion-label>Alumnos</ion-label>
        <ion-icon name="people-outline" slot="end"></ion-icon>
      </ion-item>

    </ion-list>
  </ion-card>

  <ion-card>
    <ion-list>
      <ion-list-header>
        <h1>Opciones</h1>
      </ion-list-header>

      <ion-item>
        <ion-label>Notificaciones</ion-label>
        <ion-icon name="notifications-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item>
        <ion-label>Configuraciones</ion-label>
        <ion-icon name="settings-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item>
        <ion-label>Certificados</ion-label>
        <ion-icon name="document-text-outline" slot="end"></ion-icon>
      </ion-item>

    </ion-list>
  </ion-card>
</ion-content>
