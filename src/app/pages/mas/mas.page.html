<ion-header>
  <ion-toolbar color="primary">
    <ion-title mode="md" class="ion-text-center">Todos los elementos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light" class="ion-padding">
  <ion-card>
    <ion-list>
      <ion-list-header>
        <h1>Herramientas</h1>
      </ion-list-header>
      
      <ion-item routerLink="/tabs/cursos">
        <ion-label>Cursos</ion-label>
        <ion-icon name="book-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item routerLink="/asistencias">
        <ion-label>Asistencias</ion-label>
        <ion-icon name="checkbox-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item routerLink="/calificaciones">
        <ion-label >Calificaciones</ion-label>
        <ion-icon name="stats-chart-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item routerLink="/alumnos">
        <ion-label>Alumnos</ion-label>
        <ion-icon name="people-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item routerLink="/tabs/calendario">
        <ion-label>Calendario</ion-label>
        <ion-icon name="calendar-outline" slot="end"></ion-icon>
      </ion-item>
    </ion-list>

  </ion-card>

  <ion-card>
    <ion-list>
      <ion-list-header>
        <h1>Configuraciones</h1>
      </ion-list-header>

      <ion-item routerLink="/notificaciones">
        <ion-label>Notificaciones</ion-label>
        <ion-icon name="notifications-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item routerLink="/certificados">
        <ion-label>Certificados</ion-label>
        <ion-icon name="document-text-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item>
        <ion-toggle>
          <ion-label> Modo oscuro</ion-label>
          <ion-note color="medium"></ion-note>
        </ion-toggle>
      </ion-item>

      <ion-item routerLink="/login">
        <ion-label>Cerrar sesion</ion-label>
        <ion-icon name="arrow-back-circle-outline" slot="end"></ion-icon>
      </ion-item>

    </ion-list>
  </ion-card>
</ion-content>
