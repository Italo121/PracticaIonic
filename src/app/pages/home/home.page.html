<ion-header>
  <ion-toolbar color ="primary">
    <ion-title mode="md" class="ion-text-center">Inicio</ion-title>
    
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding" color="light" >
  
  <ion-card>
    <ion-card-header>
      <ion-card-title class="text-center">Tus cursos</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-thumbnail slot="start">
            <img alt="Silhouette of mountains" src="https://ionicframework.com/docs/img/demos/thumbnail.svg" />
          </ion-thumbnail>
          <ion-label>Lenguaje y comunicacion</ion-label>
        </ion-item>
  
        <ion-item>
          <ion-thumbnail slot="start">
            <img alt="Silhouette of mountains" src="https://ionicframework.com/docs/img/demos/thumbnail.svg" />
          </ion-thumbnail>
          <ion-label>Matematicas</ion-label>
        </ion-item>
  
        <ion-item>
          <ion-thumbnail slot="start">
            <img alt="Silhouette of mountains" src="https://ionicframework.com/docs/img/demos/thumbnail.svg" />
          </ion-thumbnail>
          <ion-label>Historia y Geografia</ion-label>
        </ion-item>
  
      </ion-list>
      <ion-button expand="block" routerLink="/cursos"> Ver todos</ion-button>
    </ion-card-content>
  </ion-card>
  
    <ion-card>
      <ion-card-header>
        <ion-card-title class="text-center">Tus alumnos</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-list>
          <ion-item>
            <ion-thumbnail slot="start">
              <img alt="Silhouette of mountains" src="https://ionicframework.com/docs/img/demos/thumbnail.svg" />
            </ion-thumbnail>
            <ion-label>Italo Zapata</ion-label>
          </ion-item>
    
          <ion-item>
            <ion-thumbnail slot="start">
              <img alt="Silhouette of mountains" src="https://ionicframework.com/docs/img/demos/thumbnail.svg" />
            </ion-thumbnail>
            <ion-label>Juan Esteban Zapata</ion-label>
          </ion-item>
    
          <ion-item>
            <ion-thumbnail slot="start">
              <img alt="Silhouette of mountains" src="https://ionicframework.com/docs/img/demos/thumbnail.svg" />
            </ion-thumbnail>
            <ion-label>Josefa Zapata</ion-label>
          </ion-item>

        </ion-list>
        <ion-button expand="block" routerLink="/alumnos"> Ver todos</ion-button>
      </ion-card-content>
    </ion-card>

</ion-content>
