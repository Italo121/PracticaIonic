<ion-header>
  <ion-toolbar color ="primary">
    <ion-title mode="md" class="ion-text-center">Inicio</ion-title>
    
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding" color="light">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Card Title</ion-card-title>
      <ion-card-subtitle>Card Subtitle</ion-card-subtitle>
    </ion-card-header>
  
    <ion-card-content>
      Here's a small text description for the card content. Nothing more, nothing less.
    </ion-card-content>
  
    <ion-button fill="clear">Action 1</ion-button>
    <ion-button fill="clear">Action 2</ion-button>
  </ion-card>

  <ion-text class="ion-padding"> Miercoles 8 de Octubre</ion-text>
  <div class="horizontal-scroll">
    <ion-card color="medium">
      <ion-card-header>

        <ion-card-subtitle>Ciencias Naturales</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>8:00 - 10:00</ion-card-content>
    </ion-card>

    <ion-card color="medium">
      <ion-card-header>
        <ion-card-subtitle>Historia</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>10:00 - 12:00</ion-card-content>
    </ion-card>

    <ion-card color="medium">
      <ion-card-header>
        <ion-card-subtitle>Lenguaje</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>12:00 - 14:00</ion-card-content>
    </ion-card>

    <ion-card color="medium">
      <ion-card-header>
        <ion-card-subtitle>Matematicas</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>14:00 - 16:00</ion-card-content>
    </ion-card>

  </div>

</ion-content>
